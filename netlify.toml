[build]
# 빌드 명령어를 한 줄로 정리했습니다.
# 1. flutter repo 클론 및 환경 변수 설정
# 2. web 설정 활성화 및 빌드 실행
command = "git clone https://github.com/flutter/flutter.git --depth 1 -b stable && export PATH=$PATH:$PWD/flutter/bin && flutter config --enable-web && flutter build web"
publish = "build/web"

[[plugins]]
package = "netlify-plugin-flutter"

[plugins.inputs]
# 빌드에 사용할 Flutter 버전
version = "3.24.4"

